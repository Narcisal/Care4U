<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>陪你說說話</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream:        #F7F0E8;
            --cream-deep:   #EDE0D0;
            --warm-white:   #FDFAF6;
            --border:       #DDD0C0;
            --text-dark:    #2C2420;
            --text-mid:     #6B5E58;
            --text-light:   #A89080;
            --orange:       #C17F5A;
            --orange-dark:  #A86844;
            --orange-pale:  #FBF0E6;
            --blue:         #4A90A4;
            --blue-pale:    #E7F3F6;
            --red:          #C94C4C;
            --red-pale:     #FCEAEA;
            --navy:         #1B2E4B;
            --brown-frame:  #8B6E52;
            --green:        #7B9E87;
            --green-pale:   #E8F5EC;
            --portrait-size: clamp(280px, min(45vw, 48vh), 600px);
            --ring-1-size: calc(var(--portrait-size) + 40px);
            --ring-2-size: calc(var(--portrait-size) + 100px);
            --portrait-image-size: clamp(240px, calc(var(--portrait-size) - 80px), 500px);
            --ring-image-1-size: calc(var(--portrait-image-size) + 40px);
            --ring-image-2-size: calc(var(--portrait-image-size) + 90px);
        }

        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background: var(--cream);
            color: var(--text-dark);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        .demo-controls {
            position: fixed;
            top: 14px;
            right: 20px;
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            background: rgba(253, 250, 246, 0.96);
            box-shadow: 0 5px 18px rgba(44, 36, 32, 0.12);
        }

        .demo-controls label {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-mid);
        }

        .demo-controls select,
        .demo-admin-link {
            min-height: 42px;
            padding: 7px 12px;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            background: var(--warm-white);
            color: var(--text-dark);
            font: 700 16px inherit;
        }

        .demo-controls select {
            cursor: pointer;
        }

        .demo-admin-link {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
        }

        .demo-controls select:focus-visible,
        .demo-admin-link:focus-visible {
            outline: 3px solid rgba(193,127,90,0.35);
            border-color: var(--orange);
        }

        /* ══════════════════════════════════════
           狀態 A：角色選擇主頁
        ══════════════════════════════════════ */

        #welcome-screen {
            flex: 1;
            display: none;
            flex-direction: row;
            overflow: hidden;
        }

        /* 左側照片區 */
        .welcome-left {
            width: 42%;
            position: relative;
            overflow: hidden;
            background: var(--cream-deep);
        }

        .left-base {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            height: 70%;
            background: #D9C4AE;
            border-radius: 50% 50% 0 0 / 40% 40% 0 0;
        }

        .left-texture {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 30% 70%, rgba(193,127,90,0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12) 0%, transparent 50%);
        }

        .agent-portrait-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            border: 0;
            background: transparent;
            cursor: pointer;
            font: inherit;
            padding: 0;
            width: 100%;
        }

        .agent-portrait-wrap:focus-visible {
            outline: 5px solid rgba(193,127,90,0.65);
            outline-offset: -10px;
        }

        .agent-portrait {
            width: 88%;
            max-height: 92%;
            object-fit: contain;
            object-position: bottom center;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 24px rgba(44,36,32,0.18));
            transition: transform 0.18s, filter 0.18s;
        }

        .agent-portrait-wrap:hover .agent-portrait,
        .agent-portrait-wrap:focus-visible .agent-portrait {
            transform: scale(1.025);
            filter: drop-shadow(0 14px 36px rgba(193,127,90,0.34));
        }

        /* 對話氣泡 */
        .speech-bubble {
            position: absolute;
            bottom: 72%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(48, 38, 31, 0.78);
            color: #F7F0E8;
            border-radius: 14px;
            padding: 14px 24px;
            z-index: 10;
            min-width: 380px;
            max-width: 88vw;
            text-align: center;
            animation: floatBubble 3.5s ease-in-out infinite;
            pointer-events: none;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid rgba(60, 40, 25, 0.70);
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%       { transform: translateX(-50%) translateY(-6px); }
        }

        .speech-bubble-text {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.45;
            letter-spacing: 0;
        }

        /* 右側選擇區 */
        .welcome-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 84px 52px 48px;
            background: var(--warm-white);
            position: relative;
            overflow-y: auto;
        }

        .welcome-right::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange), #E8A878, var(--orange));
        }

        /* 卡片網格 */
        .persona-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            align-content: start;
            margin-top: 8px;
        }

        .persona-cell {
            background: var(--cream);
            border: 2px solid var(--border);
            border-radius: 18px;
            padding: 32px 18px 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1;
            transition: border-color 0.2s, background 0.2s, transform 0.18s;
            position: relative;
            overflow: hidden;
        }

        .persona-cell:hover,
        .persona-cell:focus-visible {
            border-color: var(--orange);
            background: var(--orange-pale);
            transform: scale(1.02);
            outline: none;
        }

        .persona-cell.selected {
            border-color: var(--orange);
            background: var(--orange-pale);
        }

        .persona-cell-avatar {
            width: 70%;
            aspect-ratio: 1;
            border-radius: 50%;
            object-fit: cover;
            background: var(--cream-deep);
            margin-bottom: 18px;
            transition: transform 0.18s;
        }

        .persona-cell:hover .persona-cell-avatar,
        .persona-cell:focus-visible .persona-cell-avatar {
            transform: scale(1.05);
        }

        .persona-cell-name {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .persona-cell-rel {
            font-size: 24px;
            color: var(--text-mid);
            letter-spacing: 0;
        }

        .elder-picker {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            color: var(--text-mid);
            font-size: 22px;
            font-weight: 700;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .persona-cell:nth-child(1) { animation: fadeUp 0.4s ease-out 0.05s both; }
        .persona-cell:nth-child(2) { animation: fadeUp 0.4s ease-out 0.15s both; }
        .persona-cell:nth-child(3) { animation: fadeUp 0.4s ease-out 0.25s both; }
        .persona-cell:nth-child(4) { animation: fadeUp 0.4s ease-out 0.35s both; }

        /* ══════════════════════════════════════
           狀態 B：智慧對話陪伴頁面
        ══════════════════════════════════════ */

        #main-screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        /* 頂部列 */
        .top-bar {
            flex-shrink: 0;
            background: #EDE0D0;
            border-bottom: 1.5px solid var(--border);
            padding: 16px 390px 16px 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-logo { font-size: 30px; }

        .top-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0;
            color: var(--text-dark);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #elder-name-display {
            font-size: 24px;
            font-weight: 700;
            color: var(--orange);
        }

        .btn-switch-top {
            min-height: 56px;
            padding: 10px 24px;
            font-size: 22px;
            font-family: inherit;
            font-weight: 700;
            background: var(--warm-white);
            color: var(--text-dark);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-switch-top:hover,
        .btn-switch-top:focus-visible {
            background: var(--orange-pale);
            border-color: var(--orange);
            outline: none;
        }

        /* 主體 */
        .main-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            position: relative;
            padding: 38px 24px 58px;
            background: linear-gradient(135deg, #FDF7F2 0%, #F5ECE2 100%);
            overflow-y: auto;
        }


        /* 說話光暈 */
        .speaking-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speaking-ring {
            position: absolute;
            width: var(--ring-1-size);
            height: var(--ring-1-size);
            border-radius: 50%;
            border: 3px solid var(--orange);
            opacity: 0;
            pointer-events: none;
        }

        #speaking-ring-2 {
            width: var(--ring-2-size);
            height: var(--ring-2-size);
        }

        .speaking-ring.active {
            animation: pulseRing 1.6s ease-out infinite;
        }

        #speaking-ring-2.active {
            animation: pulseRing 1.6s ease-out 0.6s infinite;
        }

        @keyframes pulseRing {
            0%   { transform: scale(0.88); opacity: 0.6; }
            100% { transform: scale(1.12); opacity: 0; }
        }

        /* 人像 */
        #persona-portrait {
            width: var(--portrait-size);
            height: var(--portrait-size);
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            transition: box-shadow 0.3s;
        }

        #persona-portrait.speaking {
            box-shadow: 0 8px 48px rgba(193,127,90,0.6);
        }

        /* 姓名與稱謂 */
        .persona-info { text-align: center; }

        #persona-portrait-name {
            font-size: 36px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        #persona-portrait-rel {
            font-size: 26px;
            color: var(--text-mid);
        }

        /* 狀態提示 */
        .status-label {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-mid);
            letter-spacing: 0;
            opacity: 0.85;
        }

        #chat-container {
            width: 100%;
            max-width: min(820px, 92vw);
            max-height: 36vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin: 12px 0;
            max-width: min(820px, 92vw);
        }

        .msg-row.user {
            flex-direction: row-reverse;
            align-self: flex-end;
        }

        .msg-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .msg-bubble {
            border-radius: 18px;
            padding: 18px 22px;
            font-size: 24px;
            line-height: 1.55;
            max-width: 680px;
            box-shadow: 0 1px 4px rgba(44,36,32,0.08);
        }

        .msg-bubble.ai {
            background: var(--warm-white);
            color: var(--text-dark);
            border-top-left-radius: 6px;
        }

        .msg-bubble.user {
            background: var(--green-pale);
            color: var(--text-dark);
            border-top-right-radius: 6px;
        }


        .status-label.listening::before {
            content: '● ';
            color: var(--green);
            animation: breathe 1.8s ease-in-out infinite;
        }

        .status-label.speaking::before {
            content: '● ';
            color: var(--orange);
            animation: breathe 0.9s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        /* 懷舊相框 */
        #image-frame {
            display: none;
            position: absolute;
            right: 4%;
            top: 50%;
            transform: translateY(-50%);
            border: 6px solid var(--brown-frame);
            border-radius: 16px;
            overflow: hidden;
            width: 34%;
            aspect-ratio: 4/3;
            animation: frameSlideIn 0.8s ease-out both;
            z-index: 5;
            background: #f0e8de;
            box-shadow: 0 8px 40px rgba(0,0,0,0.18);
        }

        @keyframes frameSlideIn {
            from { opacity: 0; transform: translateY(-50%) translateX(40px); }
            to   { opacity: 1; transform: translateY(-50%) translateX(0); }
        }

        #image-frame-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        #image-frame.loading::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, #e5d9cd 20%, #f7f0e8 40%, #e5d9cd 60%);
            background-size: 220% 100%;
            animation: frameSkeleton 1.4s ease-in-out infinite;
        }

        @keyframes frameSkeleton {
            from { background-position: 100% 0; }
            to { background-position: -100% 0; }
        }

        .memory-frame-caption {
            display: none;
        }

        /* 錄音指示 */
        #recording-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #FDECEA;
            border-radius: 12px;
            font-size: 22px;
            color: #E74C3C;
        }

        #recording-indicator.active { display: flex; }

        .rec-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #E74C3C;
            flex-shrink: 0;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        /* 切換人格彈窗 */
        #persona-switcher {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .switcher-box {
            background: var(--warm-white);
            border-radius: 18px;
            padding: 36px;
            width: 90%;
            max-width: 520px;
            box-shadow: 0 12px 60px rgba(0,0,0,0.25);
        }

        .switcher-title {
            font-size: 30px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-dark);
            letter-spacing: 0;
        }

        #switcher-persona-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .btn-cancel {
            width: 100%;
            min-height: 64px;
            padding: 16px;
            font-size: 24px;
            font-family: inherit;
            font-weight: 700;
            background: var(--border);
            color: var(--text-mid);
            border: none;
            border-radius: 16px;
            cursor: pointer;
        }

        .switcher-persona-option {
            display: flex;
            align-items: center;
            gap: 18px;
            min-height: 86px;
            padding: 14px 18px;
            border-radius: 14px;
            cursor: pointer;
            border: 2px solid var(--border);
            background: white;
            transition: background 0.2s, border-color 0.2s;
        }

        .switcher-persona-option.active {
            border-color: var(--orange);
            background: var(--orange-pale);
        }

        .switcher-persona-option:hover,
        .switcher-persona-option:focus-visible {
            border-color: var(--orange);
            background: var(--orange-pale);
            outline: none;
        }

        .switcher-persona-option img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            flex-shrink: 0;
        }

        /* 人像滑左狀態 */
        .persona-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: all 0.5s ease;
        }

        /* ── 有圖片時：人像略左移為主角，圖片從右下 overlap ── */
        .persona-panel.with-image {
            position: absolute;
            left: 35%;
            top: 50%;
            transform: translate(-50%, -50%);
            gap: 16px;
            z-index: 4;
        }

        .persona-panel.with-image #persona-portrait {
            width: var(--portrait-image-size);
            height: var(--portrait-image-size);
        }

        .persona-panel.with-image .speaking-ring {
            width: var(--ring-image-1-size);
            height: var(--ring-image-1-size);
        }

        .persona-panel.with-image #speaking-ring-2 {
            width: var(--ring-image-2-size);
            height: var(--ring-image-2-size);
        }

        .persona-panel.with-image #persona-portrait-name {
            font-size: 34px;
        }

        .persona-panel.with-image #persona-portrait-rel {
            font-size: 24px;
        }

        .persona-panel.with-image .status-label {
            font-size: 24px;
        }

        /* 圖片：在人像右下方 overlap */
        .main-body.has-image #image-frame {
            left: 46%;
            right: auto;
            top: 54%;
            width: 38%;
            z-index: 2;
        }

        @media (max-width: 900px) {
            :root {
                --portrait-size: clamp(260px, min(72vw, 50vh), 430px);
            }
            body { overflow: auto; height: auto; min-height: 100dvh; }
            #welcome-screen { flex-direction: column; min-height: 100dvh; }
            .welcome-left { width: 100%; height: 34dvh; min-height: 260px; }
            .welcome-right { padding: 72px 22px 28px; }
            .speech-bubble { min-width: min(380px, 86vw); bottom: 70%; }
            .speech-bubble-text { font-size: 21px; }
            .persona-grid { gap: 12px; }
            .persona-cell { border-radius: 18px; padding: 22px 12px 18px; }
            .persona-cell-name { font-size: 24px; }
            .persona-cell-rel { font-size: 18px; }
            .main-body { justify-content: flex-start; padding-top: 24px; overflow-y: auto; }
            .demo-controls {
                position: fixed;
                top: 8px;
                right: 8px;
                gap: 6px;
                padding: 6px;
            }
            .demo-controls label { display: none; }
            .demo-controls select,
            .demo-admin-link {
                min-height: 38px;
                padding: 6px 9px;
                font-size: 14px;
            }
            .top-bar {
                padding: 60px 16px 12px;
                align-items: flex-end;
            }
            .top-right { gap: 8px; }
            .btn-switch-top {
                min-height: 44px;
                padding: 7px 12px;
                font-size: 17px;
            }
        }

        @media (max-height: 700px) {
            :root {
                --portrait-size: clamp(250px, min(42vw, 44vh), 420px);
            }
            .top-bar {
                padding-top: 8px;
                padding-bottom: 8px;
            }
            .top-title { font-size: 24px; }
            .btn-switch-top {
                min-height: 44px;
                padding-top: 6px;
                padding-bottom: 6px;
                font-size: 18px;
            }
            .main-body {
                gap: 16px;
                padding-top: 18px;
                padding-bottom: 24px;
            }
            .persona-panel { gap: 12px; }
            #persona-portrait-name { font-size: 30px; }
            #persona-portrait-rel { font-size: 22px; }
            .status-label { font-size: 26px; }
        }
    </style>
</head>
<body>

<nav class="demo-controls" aria-label="Demo 導覽">
    <label for="elder-switch-select">目前長者</label>
    <select id="elder-switch-select" onchange="switchElder(this.value)" aria-label="切換長者">
        <option value="W001">王大明（W001）</option>
        <option value="C001">陳秀英（C001）</option>
        <option value="L001">林月琴（L001）</option>
    </select>
    <a class="demo-admin-link" href="/admin">後台管理</a>
</nav>

<!-- 狀態 A：照護人員示範用選擇頁，長者端不顯示 -->
<div id="welcome-screen">

    <div class="welcome-left">
        <div class="left-base"></div>
        <div class="left-texture"></div>
        <button id="welcome-start-btn" class="agent-portrait-wrap" type="button" onclick="startGuideChat()" aria-label="開始聊天">
            <img class="agent-portrait"
                 id="welcome-active-portrait"
                 src="/static/avatars/ai_assistant_nobg.png"
                 alt="陪伴者">
        </button>
        <div class="speech-bubble">
            <div class="speech-bubble-text" id="welcome-active-bubble">家人和我都在這裡陪你喔<br>想和我，還是哪位家人說說話？</div>
        </div>
    </div>

    <div class="welcome-right">
        <div id="welcome-persona-list" class="persona-grid">
            <div style="text-align:center;color:#BDC3C7;padding:20px;font-size:20px;grid-column:1/-1;">載入中...</div>
        </div>
    </div>
</div>

<!-- 狀態 B：陪伴對話頁面 -->
<div id="main-screen">

    <div class="top-bar">
        <div class="top-left">
            <div class="top-logo">🌸</div>
            <div class="top-title">陪你說說話</div>
        </div>
        <div class="top-right">
            <button id="persona-switcher-btn" class="btn-switch-top" onclick="showPersonaSwitcher()">換人陪我</button>
        </div>
    </div>

    <div class="main-body">
        <div class="persona-panel">
            <div class="speaking-wrap">
                <div class="speaking-ring" id="speaking-ring-1"></div>
                <div class="speaking-ring" id="speaking-ring-2"></div>
                <img id="persona-portrait"
                     src="/static/avatars/ai_assistant_nobg.png"
                     alt="陪伴者">
            </div>

            <div class="persona-info">
                <div id="persona-portrait-name">陪伴者</div>
                <div id="persona-portrait-rel">陪你說說話</div>
            </div>

            <div class="status-label listening" id="status-label">可以慢慢說，我在聽</div>
        </div>

        <div id="chat-container" style="display:none;"></div>

        <div id="image-frame">
            <img id="image-frame-img" src="" alt="回憶圖片">
            <div class="memory-frame-caption">✨ 為您喚起的記憶</div>
        </div>

        <!-- 保持 app.js 功能相容 -->
        <input id="text-input" type="text" style="display:none;" disabled>
        <button id="send-btn" style="display:none;" disabled>送出</button>
        <button id="hold-talk-btn" style="display:none;" disabled>開始說話</button>
        <button id="start-btn" style="display:none;">開始聊天</button>
        <button id="clear-btn" style="display:none;">清除</button>
        <div id="recording-indicator">
            <div class="rec-dot"></div>
            <span id="voice-status">正在錄音...</span>
        </div>
        <div id="chat-count-display" style="display:none;">
            對話輪數：<span id="chat-count">0</span>
        </div>
    </div>
</div>

<div id="persona-switcher" onclick="if (event.target === this) closeSwitcher()">
    <div class="switcher-box">
        <div class="switcher-title">想換誰陪你說話？</div>
        <div id="switcher-persona-list"></div>
        <button class="btn-cancel" onclick="closeSwitcher()">先不用</button>
    </div>
</div>

<script src="/static/app.js?v=30"></script>
</body>
</html>
