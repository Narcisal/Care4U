<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Care U - 智慧照護陪伴</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream:        #F7F0E8;
            --cream-deep:   #EDE0D0;
            --warm-white:   #FDFAF6;
            --border:       #DDD0C0;
            --text-dark:    #2C2420;
            --text-mid:     #6B5E58;
            --text-light:   #A89080;
            --orange:       #C17F5A;
            --orange-dark:  #A86844;
            --orange-pale:  #FBF0E6;
            --blue:         #4A90A4;
            --blue-pale:    #E7F3F6;
            --red:          #C94C4C;
            --red-pale:     #FCEAEA;
            --navy:         #1B2E4B;
            --brown-frame:  #8B6E52;
            --green:        #7B9E87;
            --green-pale:   #E8F5EC;
        }

        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background: var(--cream);
            color: var(--text-dark);
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* ══════════════════════════════════════
           狀態 A：角色選擇主頁
        ══════════════════════════════════════ */

        #welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
        }

        /* 左側照片區 */
        .welcome-left {
            width: 42%;
            position: relative;
            overflow: hidden;
            background: var(--cream-deep);
        }

        .left-base {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 110%;
            height: 70%;
            background: #D9C4AE;
            border-radius: 50% 50% 0 0 / 40% 40% 0 0;
        }

        .left-texture {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 30% 70%, rgba(193,127,90,0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.12) 0%, transparent 50%);
        }

        .agent-portrait-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .agent-portrait {
            width: 88%;
            max-height: 92%;
            object-fit: contain;
            object-position: bottom center;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 8px 24px rgba(44,36,32,0.18));
        }

        /* 對話氣泡 */
        .speech-bubble {
            position: absolute;
            bottom: 72%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(60, 40, 25, 0.70);
            color: #F7F0E8;
            border-radius: 14px;
            padding: 12px 24px;
            z-index: 10;
            white-space: nowrap;
            animation: floatBubble 3.5s ease-in-out infinite;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid rgba(60, 40, 25, 0.70);
        }

        @keyframes floatBubble {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%       { transform: translateX(-50%) translateY(-6px); }
        }

        .speech-bubble-text {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        /* 右側選擇區 */
        .welcome-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 44px 48px;
            background: var(--warm-white);
            position: relative;
            overflow-y: auto;
        }

        .welcome-right::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--orange), #E8A878, var(--orange));
        }

        /* 卡片網格 */
        .persona-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-content: start;
            margin-top: 8px;
        }

        .persona-cell {
            background: var(--cream);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 32px 16px 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            aspect-ratio: 1;
            transition: border-color 0.2s, background 0.2s, transform 0.18s;
            position: relative;
            overflow: hidden;
        }

        .persona-cell:hover {
            border-color: var(--orange);
            background: var(--orange-pale);
            transform: scale(1.04);
        }

        .persona-cell.selected {
            border-color: var(--orange);
            background: var(--orange-pale);
        }

        .persona-cell-avatar {
            width: 70%;
            aspect-ratio: 1;
            border-radius: 50%;
            object-fit: cover;
            background: var(--cream-deep);
            margin-bottom: 18px;
            transition: transform 0.18s;
        }

        .persona-cell:hover .persona-cell-avatar {
            transform: scale(1.05);
        }

        .persona-cell-name {
            font-size: 30px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .persona-cell-rel {
            font-size: 22px;
            color: var(--text-light);
            letter-spacing: 0.5px;
        }

        .elder-picker {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            color: var(--text-mid);
            font-size: 18px;
            font-weight: 700;
        }

        #welcome-elder-select {
            width: 180px;
            height: 44px;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--cream);
            color: var(--text-dark);
            font: inherit;
            font-size: 18px;
            padding: 0 12px;
        }


        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .persona-cell:nth-child(1) { animation: fadeUp 0.4s ease-out 0.05s both; }
        .persona-cell:nth-child(2) { animation: fadeUp 0.4s ease-out 0.15s both; }
        .persona-cell:nth-child(3) { animation: fadeUp 0.4s ease-out 0.25s both; }
        .persona-cell:nth-child(4) { animation: fadeUp 0.4s ease-out 0.35s both; }

        /* ══════════════════════════════════════
           狀態 B：智慧對話陪伴頁面
        ══════════════════════════════════════ */

        #main-screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        /* 頂部列 */
        .top-bar {
            flex-shrink: 0;
            background: #EDE0D0;
            border-bottom: 1.5px solid var(--border);
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-logo { font-size: 26px; }

        .top-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-dark);
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #elder-name-display {
            font-size: 20px;
            font-weight: 700;
            color: var(--orange);
        }

        .btn-switch-top {
            padding: 8px 20px;
            font-size: 16px;
            font-family: inherit;
            font-weight: 700;
            background: transparent;
            color: var(--text-mid);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-switch-top:hover { background: #D9C4AE; }

        /* 主體 */
        .main-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            position: relative;
            padding: 40px 20px 60px;
            background: linear-gradient(135deg, #FDF7F2 0%, #F5ECE2 100%);
            position: relative;
        }


        /* 說話光暈 */
        .speaking-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speaking-ring {
            position: absolute;
            width: 640px; height: 640px;
            border-radius: 50%;
            border: 3px solid var(--orange);
            opacity: 0;
            pointer-events: none;
        }

        #speaking-ring-2 { width: 700px; height: 700px; }

        .speaking-ring.active {
            animation: pulseRing 1.6s ease-out infinite;
        }

        #speaking-ring-2.active {
            animation: pulseRing 1.6s ease-out 0.6s infinite;
        }

        @keyframes pulseRing {
            0%   { transform: scale(0.88); opacity: 0.6; }
            100% { transform: scale(1.12); opacity: 0; }
        }

        /* 人像 */
        #persona-portrait {
            width: 600px; height: 600px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            transition: box-shadow 0.3s;
        }

        #persona-portrait.speaking {
            box-shadow: 0 8px 48px rgba(193,127,90,0.6);
        }

        /* 姓名與稱謂 */
        .persona-info { text-align: center; }

        #persona-portrait-name {
            font-size: 36px;
            font-weight: 900;
            color: var(--text-dark);
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        #persona-portrait-rel {
            font-size: 20px;
            color: var(--text-light);
        }

        /* 狀態提示 */
        .status-label {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-mid);
            letter-spacing: 2px;
            opacity: 0.85;
        }

        .status-label.listening::before {
            content: '● ';
            color: var(--green);
            animation: breathe 1.8s ease-in-out infinite;
        }

        .status-label.speaking::before {
            content: '● ';
            color: var(--orange);
            animation: breathe 0.9s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        /* 懷舊相框 */
        #image-frame {
            display: none;
            position: absolute;
            right: 5%;
            top: 50%;
            transform: translateY(-50%);
            border: 8px solid var(--brown-frame);
            border-radius: 12px;
            overflow: hidden;
            width: 42%;
            aspect-ratio: 4/3;
            animation: frameSlideIn 0.8s ease-out both;
            z-index: 5;
        }

        @keyframes frameSlideIn {
            from { opacity: 0; transform: translateY(-50%) translateX(40px); }
            to   { opacity: 1; transform: translateY(-50%) translateX(0); }
        }

        #image-frame-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .memory-frame-caption {
            background: var(--brown-frame);
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            text-align: center;
            padding: 8px 12px;
            letter-spacing: 1px;
        }

        /* 錄音指示 */
        #recording-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #FDECEA;
            border-radius: 12px;
            font-size: 18px;
            color: #E74C3C;
        }

        #recording-indicator.active { display: flex; }

        .rec-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #E74C3C;
            flex-shrink: 0;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.2; }
        }

        /* 切換人格彈窗 */
        #persona-switcher {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .switcher-box {
            background: var(--warm-white);
            border-radius: 28px;
            padding: 36px;
            width: 90%;
            max-width: 520px;
            box-shadow: 0 12px 60px rgba(0,0,0,0.25);
        }

        .switcher-title {
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-dark);
            letter-spacing: 2px;
        }

        #switcher-persona-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .btn-cancel {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-family: inherit;
            font-weight: 700;
            background: var(--border);
            color: var(--text-mid);
            border: none;
            border-radius: 16px;
            cursor: pointer;
        }

        /* 人像滑左狀態 */
        .speaking-wrap.with-image {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.6s ease;
        }

        .speaking-wrap.with-image #persona-portrait {
            width: 380px;
            height: 380px;
        }

        .speaking-wrap.with-image .speaking-ring {
            width: 420px; height: 420px;
        }

        .speaking-wrap.with-image #speaking-ring-2 {
            width: 470px; height: 470px;
        }

        @media (max-width: 900px) {
            body { overflow: auto; height: auto; min-height: 100dvh; }
            #welcome-screen { flex-direction: column; min-height: 100dvh; }
            .welcome-left { width: 100%; height: 34dvh; min-height: 260px; }
            .welcome-right { padding: 28px 22px; }
            .persona-grid { gap: 12px; }
            .persona-cell { border-radius: 18px; padding: 22px 12px 18px; }
            .persona-cell-name { font-size: 24px; }
            .persona-cell-rel { font-size: 18px; }
            #persona-portrait { width: min(72vw, 430px); height: min(72vw, 430px); }
            .speaking-ring { width: min(78vw, 480px); height: min(78vw, 480px); }
            #speaking-ring-2 { width: min(84vw, 530px); height: min(84vw, 530px); }
            .main-body { justify-content: flex-start; padding-top: 24px; overflow-y: auto; }
        }
    </style>
</head>
<body>

<!-- 狀態 A：角色選擇主頁 -->
<div id="welcome-screen">

    <div class="welcome-left">
        <div class="left-base"></div>
        <div class="left-texture"></div>
        <div class="agent-portrait-wrap">
            <img class="agent-portrait"
                 src="/static/avatars/ai_assistant_nobg.png"
                 alt="AI 助理">
        </div>
        <div class="speech-bubble">
            <div class="speech-bubble-text">想和誰聊天呢？</div>
        </div>
    </div>

    <div class="welcome-right">
        <label class="elder-picker" for="welcome-elder-select">
            <span>長者</span>
            <select id="welcome-elder-select">
                <option value="W001">王大明</option>
                <option value="C001">陳秀英</option>
                <option value="L001">林月琴</option>
            </select>
        </label>
        <div id="welcome-persona-list" class="persona-grid">
            <div style="text-align:center;color:#BDC3C7;padding:20px;font-size:20px;grid-column:1/-1;">載入中...</div>
        </div>
    </div>
</div>

<!-- 狀態 B：智慧對話陪伴頁面 -->
<div id="main-screen">

    <div class="top-bar">
        <div class="top-left">
            <div class="top-logo">🌸</div>
            <div class="top-title">AI Care U</div>
        </div>
        <div class="top-right">
            <div id="elder-name-display">載入中...</div>
            <button class="btn-switch-top" onclick="showPersonaSwitcher()">切換陪伴者</button>
        </div>
    </div>

    <div class="main-body">
        <div class="speaking-wrap">
            <div class="speaking-ring" id="speaking-ring-1"></div>
            <div class="speaking-ring" id="speaking-ring-2"></div>
            <img id="persona-portrait"
                 src="/static/avatars/ai_assistant_nobg.png"
                 alt="陪伴者">
        </div>

        <div class="persona-info">
            <div id="persona-portrait-name">AI 助理</div>
            <div id="persona-portrait-rel">您的智慧照護陪伴</div>
        </div>

        <div class="status-label listening" id="status-label">AI 助理正在聆聽</div>

        <div id="image-frame">
            <img id="image-frame-img" src="" alt="回憶圖片">
            <div class="memory-frame-caption">✨ 為您喚起的記憶</div>
        </div>

        <!-- 保持 app.js 功能相容 -->
        <input id="text-input" type="text" style="display:none;" disabled>
        <button id="send-btn" style="display:none;" disabled>送出</button>
        <button id="hold-talk-btn" style="display:none;" disabled>🎙️ 按住說話</button>
        <button id="start-btn" style="display:none;">開始對話</button>
        <button id="clear-btn" style="display:none;">清除</button>
        <div id="recording-indicator">
            <div class="rec-dot"></div>
            <span id="voice-status">正在錄音...</span>
        </div>
        <div id="chat-count-display" style="display:none;">
            對話輪數：<span id="chat-count">0</span>
        </div>
    </div>
</div>

<!-- 切換人格彈窗 -->
<div id="persona-switcher">
    <div class="switcher-box">
        <div class="switcher-title">選擇陪伴者</div>
        <div id="switcher-persona-list"></div>
        <button class="btn-cancel" onclick="closeSwitcher()">取消</button>
    </div>
</div>

<script src="/static/app.js?v=15"></script>
</body>
</html>
