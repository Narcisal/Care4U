<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Care U - 智慧照護陪伴</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --cream: #F7F3EE;
            --warm-white: #FDFAF6;
            --border: #E0D8D0;
            --text-dark: #2C2420;
            --text-mid: #6B5E58;
            --text-light: #A89890;
            --orange: #C17F5A;
            --orange-dark: #A86844;
            --green: #7B9E87;
            --green-dark: #5F8470;
        }

        body {
            font-family: 'Noto Serif TC', 'Microsoft JhengHei', serif;
            background: var(--cream);
            color: var(--text-dark);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== 初始選擇畫面 ===== */
        #welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            background: linear-gradient(160deg, #FDF6EF 0%, #F0E8DF 100%);
        }

        .welcome-logo {
            font-size: 72px;
            margin-bottom: 12px;
            animation: bloom 0.8s ease-out;
        }

        @keyframes bloom {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .welcome-title {
            font-size: 44px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 6px;
            letter-spacing: 4px;
        }

        .welcome-subtitle {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .welcome-card {
            background: var(--warm-white);
            border-radius: 28px;
            padding: 36px 32px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.10);
            border: 1px solid var(--border);
        }

        .welcome-label {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 12px;
            display: block;
            letter-spacing: 1px;
        }

        .welcome-select {
            width: 100%;
            padding: 16px 20px;
            font-size: 26px;
            font-weight: 700;
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--cream);
            color: var(--text-dark);
            margin-bottom: 28px;
            cursor: pointer;
        }

        .persona-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 28px;
        }

        .persona-option {
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            border: 3px solid var(--border);
            background: var(--warm-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .persona-option:hover {
            border-color: var(--orange);
            background: #FEF6EE;
            transform: translateY(-2px);
        }

        .persona-option.selected {
            border-color: var(--orange);
            background: #FEF3E8;
            box-shadow: 0 4px 16px rgba(193,127,90,0.2);
        }

        .persona-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--border);
        }

        .persona-option.selected .persona-avatar {
            border-color: var(--orange);
        }

        .persona-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .persona-rel {
            font-size: 15px;
            color: var(--text-light);
        }

        .persona-check {
            color: var(--orange);
            font-size: 22px;
        }

        .btn-start-chat {
            width: 100%;
            padding: 22px;
            font-size: 28px;
            font-weight: 700;
            font-family: inherit;
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: all 0.2s;
            box-shadow: 0 4px 16px rgba(193,127,90,0.3);
        }

        .btn-start-chat:hover {
            background: var(--orange-dark);
            transform: translateY(-2px);
        }

        /* ===== 主畫面 ===== */
        #main-screen {
            flex: 1;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        /* 頂部 */
        .top-bar {
            background: var(--warm-white);
            border-bottom: 2px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-logo { font-size: 32px; }

        .top-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .top-right { text-align: right; }

        .top-elder-name {
            font-size: 22px;
            font-weight: 700;
            color: var(--orange);
        }

        .top-emotion {
            font-size: 15px;
            color: var(--text-light);
            margin-top: 2px;
        }

        /* 內容區：左右分割 */
        .content-area {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            overflow: hidden;
            gap: 0;
        }

        /* 左側：對話區 */
        .left-panel {
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--border);
            overflow: hidden;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: #D6CEC7 transparent;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-light);
        }

        .chat-empty-icon { font-size: 56px; opacity: 0.3; }

        .chat-empty-text {
            font-size: 22px;
            text-align: center;
            line-height: 1.8;
        }

        /* 圖片相框區 */
        .image-frame-area {
            padding: 0 24px 16px;
            flex-shrink: 0;
        }

        .image-frame {
            background: var(--warm-white);
            border: 3px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-frame img {
            width: 100%;
            max-height: 220px;
            object-fit: cover;
        }

        .image-frame-label {
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text-light);
            text-align: center;
            background: var(--warm-white);
        }

        /* 輸入區 */
        .input-area {
            background: var(--warm-white);
            border-top: 2px solid var(--border);
            padding: 14px 20px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }

        .text-input {
            flex: 1;
            padding: 14px 18px;
            font-size: 20px;
            font-family: inherit;
            border: 2px solid var(--border);
            border-radius: 14px;
            background: var(--cream);
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s;
        }

        .text-input:focus { border-color: var(--orange); }
        .text-input:disabled { opacity: 0.5; }

        .btn-send {
            padding: 14px 22px;
            font-size: 20px;
            font-family: inherit;
            font-weight: 700;
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-send:hover { background: var(--orange-dark); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

        /* 按住說話按鈕 */
        .btn-hold-talk {
            padding: 14px 20px;
            font-size: 20px;
            font-family: inherit;
            font-weight: 700;
            background: var(--green);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
            white-space: nowrap;
        }

        .btn-hold-talk:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-hold-talk.recording {
            background: #E74C3C;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(231,76,60,0.4);
        }

        /* 控制按鈕 */
        .control-area {
            background: var(--warm-white);
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .btn-begin {
            flex: 1;
            padding: 16px;
            font-size: 22px;
            font-family: inherit;
            font-weight: 700;
            background: var(--orange);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(193,127,90,0.25);
        }

        .btn-begin:hover { background: var(--orange-dark); }
        .btn-begin:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-clear {
            padding: 16px 24px;
            font-size: 20px;
            font-family: inherit;
            font-weight: 700;
            background: var(--border);
            color: var(--text-mid);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-clear:hover { background: #C8BDB7; }

        /* 右側：家屬頭像區 */
        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            background: linear-gradient(180deg, #FDF6EF 0%, #F0E8DF 100%);
            gap: 20px;
        }

        .persona-portrait-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 說話光暈動效 */
        .speaking-ring {
            position: absolute;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 4px solid var(--orange);
            opacity: 0;
            animation: none;
        }

        .speaking-ring.active {
            animation: pulse-ring 1.2s ease-out infinite;
        }

        .speaking-ring-2 {
            width: 320px;
            height: 320px;
            animation-delay: 0.4s !important;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .persona-portrait {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--warm-white);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            position: relative;
            z-index: 1;
            transition: box-shadow 0.3s;
        }

        .persona-portrait.speaking {
            box-shadow: 0 8px 40px rgba(193,127,90,0.5);
        }

        .persona-portrait-name {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
        }

        .persona-portrait-rel {
            font-size: 18px;
            color: var(--text-light);
            text-align: center;
        }

        /* 對話泡泡 */
        .msg-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            animation: fadeUp 0.3s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }

        .msg-bubble {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 20px;
            line-height: 1.7;
        }

        .msg-bubble.ai {
            background: white;
            color: var(--text-dark);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .msg-bubble.user {
            background: var(--green);
            color: white;
            border-bottom-right-radius: 4px;
        }

        /* 語音錄音狀態 */
        .recording-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #FDECEA;
            border-radius: 10px;
            font-size: 16px;
            color: #E74C3C;
        }

        .recording-indicator.active { display: flex; }

        .rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #E74C3C;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 健康卡片 */
        .health-card {
            background: #EAF4EE;
            border: 1px solid #B8DBBF;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 17px;
            color: #2D5A36;
            line-height: 1.6;
            margin: 4px 0;
        }

        .health-card-title {
            font-size: 13px;
            color: #5A8C65;
            margin-bottom: 6px;
            font-weight: 700;
        }

        /* 趨勢警報 */
        .trend-alert {
            background: #FEF3CD;
            border: 2px solid #F39C12;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 17px;
            color: #7D5A00;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ===== 初始選擇畫面 ===== -->
<div id="welcome-screen">
    <div class="welcome-logo">🌸</div>
    <div class="welcome-title">AI Care U</div>
    <div class="welcome-subtitle">您的智慧照護陪伴</div>

    <div class="welcome-card">
        <label class="welcome-label">我是</label>
        <select id="welcome-elder-select" class="welcome-select"
            onchange="loadWelcomePersonas(this.value)">
            <option value="W001">王大明</option>
            <option value="C001">陳秀英</option>
        </select>

        <label class="welcome-label">今天想和誰說話？</label>
        <div id="welcome-persona-list" class="persona-grid">
            <div style="text-align:center;color:#BDC3C7;padding:16px;font-size:18px;grid-column:1/-1;">載入中...</div>
        </div>

        <button class="btn-start-chat" onclick="enterChat()">
            開始陪伴
        </button>
    </div>
</div>

<!-- ===== 主畫面 ===== -->
<div id="main-screen">

    <!-- 頂部 -->
    <div class="top-bar">
        <div class="top-left">
            <div class="top-logo">🌸</div>
            <div class="top-title">AI Care U</div>
        </div>
        <div class="top-right">
            <div id="elder-name-display" class="top-elder-name">載入中...</div>
            <div id="emotion-display" class="top-emotion">💛 等待對話...</div>
        </div>
    </div>

    <!-- 左右分割內容區 -->
    <div class="content-area">

        <!-- 左側：對話 + 圖片 -->
        <div class="left-panel">

            <!-- 對話區 -->
            <div id="chat-container" class="chat-area">
                <div class="chat-empty">
                    <div class="chat-empty-icon">💬</div>
                    <div class="chat-empty-text">請點擊下方「開始對話」<br>來啟動陪伴系統</div>
                </div>
            </div>

            <!-- 圖片相框區 -->
            <div class="image-frame-area">
                <div id="image-frame" class="image-frame">
                    <img id="image-frame-img" src="" alt="回憶圖片" />
                    <div class="image-frame-label">✨ AI 為您生成的圖片</div>
                </div>
            </div>

            <!-- 錄音指示 -->
            <div id="recording-indicator" class="recording-indicator" style="margin: 0 20px 8px;">
                <div class="rec-dot"></div>
                <span id="voice-status">正在錄音...</span>
            </div>

            <!-- 輸入區 -->
            <div class="input-area">
                <input id="text-input" class="text-input"
                    type="text" placeholder="輸入訊息..." disabled />
                <button id="hold-talk-btn" class="btn-hold-talk" disabled>
                    🎙️ 按住說話
                </button>
                <button id="send-btn" class="btn-send" disabled>送出</button>
            </div>

            <!-- 控制按鈕 -->
            <div class="control-area">
                <button id="start-btn" class="btn-begin">
                    🌟 開始對話
                </button>
                <button id="clear-btn" class="btn-clear">
                    清除
                </button>
            </div>

        </div>

        <!-- 右側：家屬頭像 -->
        <div class="right-panel">
            <div class="persona-portrait-wrap">
                <div class="speaking-ring" id="speaking-ring-1"></div>
                <div class="speaking-ring speaking-ring-2" id="speaking-ring-2"></div>
                <img id="persona-portrait"
                    src="/static/avatars/ai_assistant.png"
                    class="persona-portrait"
                    alt="陪伴者" />
            </div>
            <div class="persona-portrait-name" id="persona-portrait-name">AI 助理</div>
            <div class="persona-portrait-rel" id="persona-portrait-rel">您的智慧照護陪伴</div>
            <div id="chat-count-display"
                style="font-size:16px; color:var(--text-light); margin-top:8px;">
                對話輪數：<span id="chat-count" style="color:var(--orange); font-weight:700;">0</span>
            </div>
            <button onclick="showPersonaSwitcher()"
    style="margin-top: 16px; padding: 14px 28px; font-size: 18px;
           font-family: inherit; font-weight: 700;
           background: white; color: var(--orange);
           border: 2px solid var(--orange); border-radius: 14px;
           cursor: pointer; transition: all 0.2s; letter-spacing: 1px;">
    🔄 切換陪伴者
</button>

<!-- 切換人格彈窗 -->
<div id="persona-switcher" style="display:none; position:fixed; inset:0;
     background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center;">
    <div style="background: var(--warm-white); border-radius: 24px; padding: 32px;
                width: 90%; max-width: 480px; box-shadow: 0 8px 40px rgba(0,0,0,0.2);">
        <div style="font-size: 24px; font-weight: 700; margin-bottom: 20px; text-align:center;">
            選擇陪伴者
        </div>
        <div id="switcher-persona-list" style="display:flex; flex-direction:column; gap:12px; margin-bottom:24px;">
        </div>
        <button onclick="closeSwitcher()"
            style="width:100%; padding:14px; font-size:18px; font-family:inherit;
                   background: var(--border); color: var(--text-mid);
                   border:none; border-radius:14px; cursor:pointer;">
            取消
        </button>
    </div>
</div>
        </div>

    </div>
</div>

<script src="/static/app.js?v=9"></script>
</body>
</html>
